openapi: 3.0.0
info:
  title: 用户登录 API
  version: 1.0.0
  description: SaaS 平台用户登录接口规范

servers:
  - url: /api/v1

paths:
  /auth/login:
    post:
      summary: 用户登录
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 6
                  example: "123456"
                rememberMe:
                  type: boolean
                  default: false
                  example: true
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 1001
                message: "参数错误：邮箱格式不正确"
                data: null
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongPassword:
                  summary: 密码错误
                  value:
                    code: 1002
                    message: "密码错误"
                    data: null
                locked:
                  summary: 账户已锁定
                  value:
                    code: 1003
                    message: "账户已锁定，请 30 分钟后再试"
                    data:
                      lockedUntil: "2026-03-31T18:30:00Z"
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 2001
                message: "服务器内部错误"
                data: null

components:
  schemas:
    LoginResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: "success"
        data:
          type: object
          properties:
            token:
              type: string
              description: JWT Token
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            expiresIn:
              type: integer
              description: Token 有效期（秒）
              example: 604800
            user:
              $ref: '#/components/schemas/User'
    
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: "user@example.com"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-01T00:00:00Z"
    
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 错误码
        message:
          type: string
          description: 错误信息
        data:
          type: object
          description: 错误详情（可选）

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
